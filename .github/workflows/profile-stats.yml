name: Update profile stats

on:
  schedule:
    # Daily at 09:17 Hong Kong time (UTC+8).
    - cron: "17 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: stats
          options: username=luoyeETH&theme=tokyonight&show_icons=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: top-langs
          options: username=luoyeETH&theme=tokyonight&layout=compact
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Generate contribution streak
        uses: DenverCoder1/github-readme-streak-stats@125aaaf200620410446ebfa51897fca3607e04fd # v1
        with:
          options: user=luoyeETH&theme=tokyonight&disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate generated images
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for name in ("stats", "top-langs", "streak"):
              path = Path("profile") / f"{name}.svg"
              root = ET.parse(path).getroot()
              if root.tag != "{http://www.w3.org/2000/svg}svg":
                  raise SystemExit(f"Invalid SVG: {path}")
              text = " ".join(root.itertext()).casefold()
              for error in ("something went wrong", "could not fetch", "could not resolve to a user", "rate limit exceeded"):
                  if error in text:
                      raise SystemExit(f"Error card detected: {path}")
              print(f"Validated {path}")
          PY

      # Publish only after all three cards are generated and validated.
      # A failed update leaves the previously committed images intact.
      - name: Commit updated images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- profile/stats.svg profile/top-langs.svg profile/streak.svg
          if git diff --cached --quiet; then
            echo "Stats images are unchanged."
            exit 0
          fi
          git commit -m "Update profile stats images"
          git pull --rebase origin main
          git push origin HEAD:main
